<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FreeBoard 白板</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* FreeBoard 2.0 界面样式 */
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f7f9fc; --ink:#1b2432; --mut:#65748a;
  --line:#dbe3ee; --accent:#3b82f6; --accent2:#2563eb; --danger:#e5484d;
  --shadow:0 6px 24px rgba(20,32,60,.14); --shadow2:0 2px 10px rgba(20,32,60,.1);
  --railbg:rgba(255,255,255,.82); --fbg:rgba(255,255,255,.6);
}
html.dark{
  --bg:#141922; --panel:#1c2431; --panel2:#222c3c; --ink:#e7edf6; --mut:#93a1b8;
  --line:#2d3a4d; --accent:#60a5fa; --accent2:#3b82f6;
  --shadow:0 6px 24px rgba(0,0,0,.4); --shadow2:0 2px 10px rgba(0,0,0,.3);
  --railbg:rgba(24,31,42,.88); --fbg:rgba(24,31,42,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{opacity:.35;pointer-events:none}
svg.ic{width:21px;height:21px;display:block}
.hide{display:none!important}
#app{position:fixed;inset:0}
.scr{position:absolute;inset:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(110,130,160,.4);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
/* ======= 通用 ======= */
.iconbtn{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.iconbtn:hover{background:rgba(110,130,160,.14)}
.iconbtn.dis svg{opacity:.3}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:9px 15px;font-size:14px;font-weight:600;white-space:nowrap}
.btn svg.ic{width:18px;height:18px}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(59,130,246,.35)}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.slim{padding:7px 11px;font-size:13px;border-radius:9px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.form-row{margin:12px 0}
.form-row label{display:block;font-size:13px;color:var(--mut);margin-bottom:7px;font-weight:600}
.form-tip{font-size:12.5px;color:var(--mut);line-height:1.7;margin-top:8px}
/* ======= 模态 ======= */
.modal-mask{position:fixed;inset:0;background:rgba(10,16,28,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border-radius:18px;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .16s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:8px;padding:15px 16px 0}
.modal-t{font-size:16.5px;font-weight:700;flex:1}
.modal-b{padding:14px 18px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:12px 16px 16px}
.confirm-msg{font-size:14.5px;line-height:1.8;color:var(--ink)}
/* ======= 提示/菜单 ======= */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:rgba(24,30,42,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;opacity:0;transition:.22s;z-index:300;pointer-events:none;max-width:82vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ctxmenu{position:fixed;z-index:260;background:var(--panel);border-radius:13px;box-shadow:var(--shadow);padding:6px;min-width:170px;max-height:70vh;overflow:auto;border:1px solid var(--line)}
.ctxmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px}
.ctxmenu button:hover{background:rgba(110,130,160,.14)}
.ctxmenu button.danger{color:var(--danger)}
.ctxmenu svg.ic{width:17px;height:17px;opacity:.8}
/* ======= 开关 ======= */
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:#c3cddb;border-radius:20px;transition:.2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
/* ======= 首页 ======= */
#scrHome{overflow:auto;background:var(--bg)}
.home-hdr{display:flex;align-items:center;gap:14px;padding:18px 22px 10px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(79,124,255,.4)}
.logo-mark svg.ic{width:26px;height:26px}
.brand h1{font-size:20px;line-height:1.2}
.brand p{font-size:12px;color:var(--mut)}
.hdr-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.home-tools{max-width:1180px;margin:8px auto 4px;padding:0 22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.searchbox{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.searchbox svg.ic{width:17px;height:17px;color:var(--mut)}
.searchbox input{flex:1;border:none;outline:none;background:transparent;padding:10px 0;font-size:14.5px;color:var(--ink)}
.home-filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;max-width:1180px;margin:0 auto;padding:0 22px 6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.act{color:var(--accent);border-style:dashed}
.chip.tag{background:transparent}
.fsep{width:1px;height:20px;background:var(--line);margin:0 2px}
.fsort{margin-left:auto;display:flex;gap:7px}
.nb-grid{max-width:1180px;margin:6px auto 60px;padding:8px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:18px}
.nb-card{background:var(--panel);border-radius:16px;border:1px solid var(--line);overflow:hidden;position:relative;transition:.16s;box-shadow:var(--shadow2)}
.nb-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.nb-prev{height:150px;position:relative;cursor:pointer}
.nb-prev canvas{position:absolute;inset:0;width:100%;height:100%}
.nb-info{padding:11px 13px 13px;cursor:pointer}
.nb-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-meta{font-size:12px;color:var(--mut);margin-top:3px}
.nb-tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.nb-tags span{font-size:11px;background:rgba(59,130,246,.12);color:var(--accent2);padding:2px 8px;border-radius:10px}
.nb-menu{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.15)}
html.dark .nb-menu{background:rgba(30,38,52,.8)}
.home-empty{text-align:center;padding:70px 20px;color:var(--mut)}
.home-empty svg.ic{width:64px;height:64px;margin:0 auto 14px;opacity:.5}
.home-empty .btn{margin-top:14px}
/* 纸张小图标 */
.paper-cell{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:9px 8px;border-radius:11px;border:1.5px solid var(--line);background:var(--panel2);width:74px}
.paper-cell.on{border-color:var(--accent);background:rgba(59,130,246,.1)}
.pp-icon{width:40px;height:30px;border-radius:4px;background:#fff;display:block;position:relative}
[data-pp="dot"]{background:#fff radial-gradient(circle,#b9c6d6 1.4px,transparent 1.6px);background-size:9px 9px}
[data-pp="grid"]{background-image:linear-gradient(#d4dce6 1px,transparent 1px),linear-gradient(90deg,#d4dce6 1px,transparent 1px);background-size:9px 9px}
[data-pp="line"]{background:repeating-linear-gradient(#fff 0 6px,#d4dce6 6px 7px)}
[data-pp="cornell"]{background:repeating-linear-gradient(#fff 0 6px,#d4dce6 6px 7px),linear-gradient(90deg,transparent 0 12px,#ef6a6a 12px 13px,transparent 13px)}
[data-pp="staff"]{background:#fff repeating-linear-gradient(#fff 0 4px,#c3d2e2 4px 5px,#fff 5px 8px);background-size:auto 9px}
[data-pp="dotD"]{background:#1b2431 radial-gradient(circle,#42536b 1.4px,transparent 1.6px);background-size:9px 9px}
[data-pp="gridD"]{background:#1b2431 linear-gradient(#33445c 1px,transparent 1px),linear-gradient(90deg,#33445c 1px,transparent 1px);background-size:9px 9px}
[data-pp="lineD"]{background:#1b2431 repeating-linear-gradient(transparent 0 6px,#3a4d68 6px 7px)}
.paper-cell i{font-style:normal;font-size:11.5px;color:var(--mut)}
.color-cell{width:34px;height:34px;border-radius:50%;border:2px solid transparent;outline:2px solid transparent}
.color-cell.on{outline-color:var(--accent)}
.color-cell.big{width:40px;height:40px}
.paper-row{display:flex;gap:9px;flex-wrap:wrap}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:11px}
.paper-big{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;border-radius:13px;border:1.5px solid var(--line);background:var(--panel2)}
.paper-big.on{border-color:var(--accent);background:rgba(59,130,246,.1)}
.paper-big i{font-style:normal;font-size:12px}
.mini-paper{width:100%;height:56px;border-radius:7px;position:relative}
.mini-paper[data-p="plain"]{background:#fff;border:1px solid var(--line)}
.mini-paper[data-p="dot"]{background:#fff radial-gradient(circle,#b9c6d6 1.4px,transparent 1.6px);background-size:14px 14px}
.mini-paper[data-p="grid"]{background-image:linear-gradient(#d4dce6 1px,transparent 1px),linear-gradient(90deg,#d4dce6 1px,transparent 1px);background-size:22px 22px;background-color:#fff}
.mini-paper[data-p="line"]{background:repeating-linear-gradient(#fff 0 12px,#d4dce6 12px 13.5px)}
.mini-paper[data-p="cornell"]{background:repeating-linear-gradient(#fff 0 12px,#d4dce6 12px 13.5px),linear-gradient(90deg,transparent 0 26%,#ef6a6a 26% 27%,transparent 27%)}
.mini-paper[data-p="staff"]{background:repeating-linear-gradient(#fff 0 4px,#c3d2e2 4px 5px,#fff 5px 8px);background-size:auto 14px}
.mini-paper[data-p="dotD"]{background:#1b2431 radial-gradient(circle,#42536b 1.6px,transparent 1.8px);background-size:14px 14px}
.mini-paper[data-p="gridD"]{background:#1b2431 linear-gradient(#33445c 1px,transparent 1px),linear-gradient(90deg,#33445c 1px,transparent 1px);background-size:22px 22px}
.mini-paper[data-p="lineD"]{background:#1b2431 repeating-linear-gradient(transparent 0 12px,#3a4d68 12px 13.5px)}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-of-type{border-bottom:none}
.set-row b{font-size:14.5px}
.set-row p{font-size:12px;color:var(--mut);margin-top:2px}
.set-row>div:first-child{flex:1}
.help-list{list-style:none;margin:8px 0 14px;display:flex;flex-direction:column;gap:6px}
.help-list li{font-size:13.5px;line-height:1.6;padding-left:16px;position:relative}
.help-list li::before{content:"·";position:absolute;left:2px;color:var(--accent);font-weight:800}
.modal h4{font-size:14px;margin:10px 0 4px;color:var(--accent2)}/* ======= 编辑器 ======= */
#scrEdit{display:flex;flex-direction:column;background:var(--bg)}
.ed-head{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:50px;z-index:40;flex:none}
.cvbadge{width:22px;height:22px;border-radius:7px;flex:none;margin:0 2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.title-inp{border:none;background:transparent;color:var(--ink);font-size:15px;font-weight:700;min-width:60px;max-width:240px;outline:none;padding:6px 8px;border-radius:8px;flex:none}
.title-inp:focus{background:var(--panel2)}
.pageinfo{font-size:12.5px;color:var(--mut);font-weight:700;margin:0 4px}
.spacer{flex:1}
.ed-head .btn span{display:inline}
.cvarea{position:relative;flex:1;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cv.cursor-grab{cursor:grab}
#cv.cursor-default{cursor:default}
/* 左侧工具条 */
.rail{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;background:var(--railbg);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:6px 5px;z-index:30;box-shadow:var(--shadow2);max-height:calc(100% - 140px);overflow:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.toolbtn{width:44px;height:44px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);position:relative}
.toolbtn svg.ic{width:21px;height:21px}
.toolbtn i{font-style:normal;font-size:9.5px;font-weight:600;opacity:.75}
.toolbtn:hover{background:rgba(110,130,160,.15)}
.toolbtn.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.4)}
/* 上下文工具卡 */
.ctxcard{position:absolute;left:70px;bottom:16px;max-width:calc(100% - 250px);background:var(--railbg);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:9px 11px;z-index:28;box-shadow:var(--shadow2);display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.ctx-sws,.sel-group{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(30,40,60,.25);flex:none;position:relative;overflow:hidden}
.sw.on{box-shadow:0 0 0 2px var(--accent),0 0 0 3.5px #fff}
html.dark .sw{border-color:#2b3648}
.sw.cust{display:inline-flex;align-items:center;justify-content:center;border:none;box-shadow:none}
.sw.cust input{position:absolute;inset:-4px;opacity:0;cursor:pointer}
.sw.small{width:21px;height:21px}
.ctx-slider{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);font-weight:600}
.ctx-slider b{min-width:30px;color:var(--ink);text-align:right;font-size:12px}
.ctx-slider.slim{max-width:120px}
.ctx-slider.wide{min-width:200px}
.ctx-slider input[type="range"],.mini-slider input[type="range"],#selW{accent-color:var(--accent);width:90px;height:4px}
.ctx-slider input[type="range"]{width:80px}
.ctx-shapes,.ctx-tbtns,.ctx-imgbtns{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.shapebtn,.tbtn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);border:1px solid transparent}
.shapebtn:hover,.tbtn:hover{background:rgba(110,130,160,.16)}
.shapebtn.on,.tbtn.on{background:var(--accent);color:#fff}
.shapebtn svg.ic,.tbtn svg.ic{width:17px;height:17px}
.ctx-sel{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:6px 8px;font-size:13px;outline:none;max-width:110px}
.sel-tip{display:flex;gap:7px;align-items:center;max-width:360px;font-size:12.5px}
.sel-tip svg.ic{width:15px;height:15px;flex:none;opacity:.7}
/* 缩放 */
.zoombox{position:absolute;right:14px;bottom:16px;display:flex;flex-direction:column;gap:6px;background:var(--railbg);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:13px;padding:5px;z-index:28;box-shadow:var(--shadow2)}
.zoombox button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.zoombox button:hover{background:rgba(110,130,160,.16)}
.zoombox .zval{font-size:11px;font-weight:700}
.zoombox svg.ic{width:18px;height:18px}
/* 页面条 */
.page-strip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:27;display:flex;align-items:center;gap:6px;background:var(--railbg);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:13px;padding:5px 6px;box-shadow:var(--shadow2);max-width:70%}
.strip-thumbs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;max-width:460px}
.strip-thumbs::-webkit-scrollbar{display:none}
.strip-pg{width:56px;height:48px;border-radius:8px;position:relative;overflow:hidden;border:2px solid transparent;flex:none;background:var(--panel2)}
.strip-pg canvas{width:100%;height:100%;position:absolute;inset:0}
.strip-pg span{position:absolute;right:2px;bottom:1px;font-size:9px;background:rgba(20,28,40,.55);color:#fff;border-radius:5px;padding:0 3px;line-height:13px}
.strip-pg.cur{border-color:var(--accent);background:var(--panel)}
.strip-btn{width:28px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.strip-btn:hover{background:rgba(110,130,160,.16)}
.strip-btn svg.ic{width:16px;height:16px}
.strip-btn.add{width:34px}
/* 选择栏 */
.selbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:32;display:flex;align-items:center;gap:8px;background:var(--railbg);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:13px;padding:6px 9px;box-shadow:var(--shadow2);max-width:calc(100% - 40px);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.sel-count{font-size:12px;font-weight:800;color:var(--accent2);padding-right:4px}
#selWGroup{display:flex;align-items:center;gap:5px}
#selW{width:70px}
#selWV{font-size:11px;min-width:18px;color:var(--mut)}
/* 文本编辑 */
.txt-over{position:absolute;z-index:35;min-height:28px;outline:2px solid var(--accent);outline-offset:3px;background:transparent;border-radius:3px;white-space:pre-wrap;word-break:break-all;line-height:1.3;cursor:text}
.txtbar{position:absolute;z-index:36;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;box-shadow:var(--shadow);max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.mini-slider{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mut)}
.mini-slider b{color:var(--ink);min-width:18px}
.txt-colors{display:inline-flex;gap:3px;align-items:center}
.txtbar .sw{width:19px;height:19px}
/* 页面面板 */
.pp-mask{position:fixed;inset:0;background:rgba(8,14,26,.35);z-index:60;transition:.2s}
.page-panel{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:62%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease;border-top:1px solid var(--line)}
.page-panel.open{transform:none}
.pp-head{display:flex;align-items:center;gap:10px;padding:13px 18px 8px;flex:none}
.pp-head b{font-size:15.5px;flex:1}
.pp-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:8px 18px 26px;overflow:auto}
.pp-card{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--panel2);cursor:pointer}
.pp-card canvas{width:100%;display:block}
.pp-card.cur{border-color:var(--accent)}
.pp-card.cur::after{content:"当前";position:absolute;left:6px;top:6px;background:var(--accent);color:#fff;font-size:10.5px;padding:2px 8px;border-radius:9px;font-weight:700}
.pp-num{position:absolute;right:6px;bottom:5px;font-size:11px;color:#fff;background:rgba(20,28,40,.55);padding:1px 7px;border-radius:8px}
.pp-tools{position:absolute;right:4px;top:4px;display:flex;gap:2px;opacity:0;transition:.15s;background:rgba(255,255,255,.9);border-radius:9px;padding:2px}
html.dark .pp-tools{background:rgba(40,50,66,.9)}
.pp-card:hover .pp-tools,.pp-card:active .pp-tools{opacity:1}
.pp-tools button{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.pp-tools button:hover{background:rgba(110,130,160,.18)}
.pp-tools svg.ic{width:14px;height:14px}
.pp-tools button:disabled{opacity:.3}/* ======= 小屏适配 ======= */
@media (max-width:720px){
  .home-hdr{padding:12px 14px 6px}
  .home-tools,.home-filters{padding:0 14px}
  .nb-grid{padding:6px 14px 80px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .nb-prev{height:110px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  .logo-mark{width:40px;height:40px;border-radius:12px}
  .btn.primary span{display:none}
  #btnNewNb{width:42px;padding:8px;justify-content:center}
  .title-inp{max-width:26vw}
  .pageinfo{display:none}
  .ed-head .btn span{display:none}
  .ed-head{padding:5px 6px}
  .rail{left:6px;padding:5px 4px;border-radius:14px}
  .toolbtn{width:40px;height:42px}
  .toolbtn i{display:none}
  .ctxcard{left:56px;right:56px;max-width:none;bottom:10px}
  .zoombox{right:8px;bottom:10px;gap:3px}
  .zoombox button{width:30px;height:30px}
  .page-strip{bottom:8px;max-width:74%}
  .selbar{top:6px}
  .btn.slim span{display:none}
  #btnPagePanel{width:38px;padding:6px;justify-content:center}
  .page-panel{max-height:68%}
  .pp-body{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .modal{padding:0}
  .ctx-slider span{display:none}
  .ctx-slider{max-width:110px}
}
@media (max-width:420px){
  .toolbtn{width:38px;height:40px}
  .ctxcard{left:52px;right:64px}
  .ctx-slider.wide{min-width:0;flex:1}
  .zoombox{right:6px;bottom:60px}
  .page-strip{max-width:calc(100% - 16px)}
}
/* 触屏悬停残留修正 */
@media (hover:none){
  .toolbtn:hover,.strip-btn:hover,.zoombox button:hover{background:none}
  .ctxmenu button:active{background:rgba(110,130,160,.2)}
}
/* 安全区 */
@supports(padding:max(0px)){
  .home-hdr{padding-top:max(16px,env(safe-area-inset-top))}
  .ed-head{padding-top:max(6px,env(safe-area-inset-top))}
  .page-panel{padding-bottom:env(safe-area-inset-bottom)}
  #toast{bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px))}
}
html,body{position:fixed;inset:0;width:100%}
@media (min-width:721px){
  html,body{position:static}
  #app{position:fixed;inset:0}
}

/* ---------- 模态框 ---------- */
function modal(title, bodyHTML, opts) {
  opts = opts || {};
  var old = $("modalBox"); if (old) old.remove();
  var m = document.createElement("div");
  m.className = "modal-mask"; m.id = "modalBox";
  m.innerHTML = '<div class="modal"><div class="modal-h"><div class="modal-t">' + esc(title) + '</div>' +
    '<button class="iconbtn" data-act="close">' + ic("close") + "</button></div>" +
    '<div class="modal-b">' + bodyHTML + "</div>" +
    '<div class="modal-f">' + (opts.footer || "") + "</div></div>";
  document.body.appendChild(m);
  if (opts.noClose !== true) {
    m.addEventListener("pointerdown", function (e) { if (e.target === m) closeModal(); });
  }
  qs('[data-act="close"]', m).onclick = closeModal;
  if (opts.onOpen) opts.onOpen(m);

function renderPageCanvas(nb, pi, opts) {
  opts = opts || {};
  var b = contentBounds(pi);
  var pad = 40;
  var cw = opts.w || 1200, ch = opts.h || 0;
  var bw, bh;
  if (!b) { bw = 900; bh = 640; }
  else { bw = b.x2 - b.x; bh = b.y2 - b.y; }
  var scale = Math.min(4, (cw - pad * 2) / Math.max(bw, 20));
  if (!b) { cw = 900; ch = 640; } else { cw = Math.ceil((bw + pad * 2) * scale); ch = Math.ceil((bh + pad * 2) * scale); }
  var c = document.createElement("canvas");
  c.width = Math.min(4096, Math.max(64, cw)); c.height = Math.min(4096, Math.max(64, ch));
  var ctx = c.getContext("2d");
  var cfg = paperCfg(nb.paper);
  ctx.fillStyle = cfg.color; ctx.fillRect(0, 0, c.width, c.height);
  if (cfg.id === "dot" || cfg.id === "grid" || cfg.id === "line" || cfg.id === "staff") {
    var ptile = paperTile(cfg);
    var sx0 = 0, sy0 = 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, c.width, c.height); ctx.clip();
    var pat = ctx.createPattern(ptile.canvas, "repeat");
    ctx.translate(-sx0, -sy0);
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, Math.ceil(c.width / ptile.w + 2) * ptile.w, Math.ceil(c.height / ptile.h + 2) * ptile.h);
    ctx.restore();
  }
  if (b) {
    ctx.save();
    ctx.scale(scale, scale);
    ctx.translate(-b.x + pad, -b.y + pad);
    nb.pages[pi].items.forEach(function (it) {
      if (it.t === "i") {
        var im = imgEl(it.src);
        if (im.complete && im.naturalWidth) { ctx.save(); ctx.translate(it.x + it.w / 2, it.y + it.h / 2); ctx.rotate(it.rot || 0); ctx.drawImage(im, -it.w / 2, -it.h / 2, it.w, it.h); ctx.restore(); }
      } else paintItem(ctx, it);
    });
    ctx.restore();
  }
  return c;
}

function safeName(s) { return String(s || "白板").replace(/[\\/:*?"<>|]/g, "_").slice(0, 60); }/* ---------- 极简 PDF 生成器（JPEG 嵌入） ---------- */
function b64bytes(durl) {
  var i = durl.indexOf(",");
  var bin = atob(durl.slice(i + 1));
  var u = new Uint8Array(bin.length);
  for (var k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return u;
}
function exportBookPDF() {
  if (!S.nb) return;
  toast("正在导出 PDF…", 600);
  setTimeout(function () {
    try {
      var pages = [];
      for (var i = 0; i < S.nb.pages.length; i++) {
        var c = renderPageCanvas(S.nb, i, { w: 1500 });
        var jpg = c.toDataURL("image/jpeg", 0.84);
        var pt = c.width / 96 * 72;
        var ph = c.height / 96 * 72;
        pages.push({ w: pt, h: ph, jpg: jpg });
      }
      var parts = [];
      var head = "%PDF-1.4\n%\xe2\xe3\xcf\xd3\n";
      parts.push(head);
      var off = head.length, offs = [0];
      var kids = [];
      for (var k = 0; k < pages.length; k++) kids.push((3 + k * 3) + " 0 R");
      function add(num, text) { offs[num] = off; var s = num + " 0 obj\n" + text + "\nendobj\n"; parts.push(s); off += s.length; }
      add(1, "<< /Type /Catalog /Pages 2 0 R >>");
      add(2, "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + pages.length + " >>");
      var imgBytes = [];
      for (var p = 0; p < pages.length; p++) {
        var pg = pages[p];
        var pageNum = 3 + p * 3, contNum = 4 + p * 3, imgNum = 5 + p * 3;
        var cs = "q\n" + pg.w + " 0 0 " + pg.h + " 0 0 cm\n/Im0 Do\nQ\n";
        add(pageNum, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + pg.w + " " + pg.h + "] /Resources << /XObject << /Im0 " + imgNum + " 0 R >> >> /Contents " + contNum + " 0 R >>");
        add(contNum, "<< /Length " + cs.length + " >>\nstream\n" + cs + "endstream");
        var ib = b64bytes(pg.jpg);
        imgBytes[p] = { num: imgNum, bytes: ib };
        offs[imgNum] = off;
        var sh = imgNum + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + pgW(pg) + " /Height " + Math.round(pgH(pg)) + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + ib.length + " >>\nstream\n";
        parts.push(sh); off += sh.length;
        parts.push(ib); off += ib.length;
        var se = "\nendstream\nendobj\n"; parts.push(se); off += se.length;
      }
      var xrefPos = off;
      var xref = "xref\n0 " + (pages.length * 3 + 3) + "\n0000000000 65535 f \n";
      for (var m = 1; m <= pages.length * 3 + 2; m++) xref += ("0000000000" + (offs[m] || 0)).slice(-10) + " 00000 n \n";
      var trailer = "trailer\n<< /Size " + (pages.length * 3 + 3) + " /Root 1 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF";
      parts.push(xref); parts.push(trailer);
      downloadFile(safeName(S.nb.name) + ".pdf", new Blob(parts, { type: "application/pdf" }));
      toast("PDF 已导出");
    } catch (err) { toast("PDF 导出失败：" + err.message); }
  }, 30);
}
function pgW(pg) { return Math.round((pg.w / 72 * 96) * 1); }
function pgH(pg) { return Math.round((pg.h / 72 * 96) * 1); }

function addPage(at) {

function dupPage(idx) {

function delPage(idx) {
  if (!S.nb) return;

    confirmBox("清空页面", "这是唯一一页，确定清空整页内容吗？", function () {
      S.nb.pages[0].items = [];

    }, "清空");
    return;
  }
  var i = idx == null ? S.pi : idx;
  confirmBox("删除页面", "确定删除第 " + (i + 1) + " 页吗？该页内容将一并删除。", function () {
    S.nb.pages.splice(i, 1);

function movePage(from, to) {

/* ---------- 缩略图 ---------- */
function drawThumb(canvas, page, w, h, paperId) {
  var c = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = w * dpr; canvas.height = h * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  var cfg = paperCfg(paperId || "plain");
  c.fillStyle = cfg.color; c.fillRect(0, 0, w, h);
  var b = null;
  page.items.forEach(function (it) {
    var ib = itemBounds(it); if (!ib) return;
    if (!b) b = { x: ib.x, y: ib.y, x2: ib.x + ib.w, y2: ib.y + ib.h };
    else { b.x = Math.min(b.x, ib.x); b.y = Math.min(b.y, ib.y); b.x2 = Math.max(b.x2, ib.x + ib.w); b.y2 = Math.max(b.y2, ib.y + ib.h); }
  });
  if (!b) {
    c.fillStyle = "rgba(120,140,170,.14)";
    c.font = "12px sans-serif"; c.textAlign = "center"; c.fillText("空白页", w / 2, h / 2 + 4);
    return;
  }
  var pad = 10;
  var z = Math.min((w - pad * 2) / (b.x2 - b.x), (h - pad * 2) / (b.y2 - b.y), 0.6);
  c.save();
  c.translate(pad + (w - pad * 2 - (b.x2 - b.x) * z) / 2 - b.x * z, pad + (h - pad * 2 - (b.y2 - b.y) * z) / 2 - b.y * z);
  c.scale(z, z);
  page.items.forEach(function (it) {
    if (it.t === "i") {
      var im = imgEl(it.src);
      if (im.complete && im.naturalWidth) { try { c.drawImage(im, it.x, it.y, it.w, it.h); } catch (e) {} }
    } else paintItem(c, it);
  });
  c.restore();
}
function refreshThumbs() {

    html = '<div class="form-tip sel-tip">' + ic("select") + " 点选元素 · 空白处拖框多选 · 拖动移动 · 手柄缩放/旋转 · Shift 加选</div>";
  } else if (t === "hand") {
    html = '<div class="form-tip sel-tip">' + ic("hand") + " 拖动画布 · 双指捏合缩放（任何工具都支持）</div>";
  } else html = "";
  box.innerHTML = html;
  box.classList.toggle("hide", !html);
  bindCtx(box, t);
}
function bindCtx(box, t) {
  if (t === "pen" || t === "pencil" || t === "hl" || t === "shape") {
    bindSwatches($("ctxSws"), function (c) { S.conf.color = c; markSw($("ctxSws"), c); });
    var w = $("ctxW"), wo = $("ctxWV");
    w.oninput = function () { S.conf.width = parseFloat(w.value); wo.textContent = w.value; };
    var o = $("ctxO"), oo = $("ctxOV");
    o.oninput = function () { S.conf.opacity = parseInt(o.value, 10) / 100; oo.textContent = o.value + "%"; };
    if (t === "shape") {
      qsa(".shapebtn", box).forEach(function (b) {
        b.onclick = function () {
          S.shape = b.getAttribute("data-shape");
          qsa(".shapebtn", box).forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          var rail = $("tbTools");
          qsa(".toolbtn", rail).forEach(function (x) { if (x.getAttribute("data-tool") === "shape") x.innerHTML = ic(S.shape) + "<i>形状</i>"; });
        };
      });
    }
  } else if (t === "eraser") {
    var e = $("ctxE"), ev = $("ctxEV");
    e.oninput = function () { S.conf.eraser = parseInt(e.value, 10); ev.textContent = e.value; };
  } else if (t === "text") {
    bindSwatches($("ctxSws"), function (c) { S.conf.txt.color = c; markSw($("ctxSws"), c); });
    var fs = $("ctxFs"), fv = $("ctxFsV");
    fs.oninput = function () { S.conf.txt.fs = parseInt(fs.value, 10); fv.textContent = fs.value; };
    $("ctxFont").onchange = function () { S.conf.txt.ff = parseInt(this.value, 10); };
    var toggles = [["txB", "bold"], ["txI", "italic"], ["txU", "under"]];
    toggles.forEach(function (pair) {
      var b = $(pair[0]);
      b.onclick = function () {
        S.conf.txt[pair[1]] = !S.conf.txt[pair[1]];
        b.classList.toggle("on", S.conf.txt[pair[1]]);
      };
    });
    var als = [["txAL", "left"], ["txAC", "center"], ["txAR", "right"]];
    als.forEach(function (pair) {
      var b = $(pair[0]);
      b.onclick = function () {
        S.conf.txt.align = pair[1];
        qsa(".tbtn", box).forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
      };
    });
  } else if (t === "img") {
    $("btnPickImg").onclick = function () { $("fImg").click(); };
    $("btnPickCam").onclick = function () { $("fCam").click(); };
    $("btnPickPdf").onclick = function () { $("fPdf").click(); };
  }
}
function markSw(container, c) {
  if (!container) return;
  qsa(".sw", container).forEach(function (b) {
    var v = b.getAttribute("data-c");
    b.classList.toggle("on", !!v && v.toLowerCase() === String(c).toLowerCase());
  });
  var ci = qs('.sw input[type="color"]', container);
  if (ci) ci.value = c;
}/* ---------- 缩放控件 ---------- */
function buildZoomBox() {
  var z = $("zoomBox");
  z.innerHTML = '<button id="zOut" title="缩小">' + ic("zoomOut") + "</button>" +
    '<button class="zval" id="zVal" title="100%">100%</button>' +
    '<button id="zIn" title="放大">' + ic("zoomIn") + "</button>" +
    '<button id="zFit" title="适配内容">' + ic("fit") + "</button>";
  $("zOut").onclick = function () { zoomStep(-1); };
  $("zIn").onclick = function () { zoomStep(1); };
  $("zFit").onclick = fitView;
  $("zVal").onclick = setZoom100;
}
function syncZoomUI() {
  var z = $("zVal"); if (z) z.textContent = Math.round(S.view.z * 100) + "%";
}
/* ---------- 页面面板/头部 ---------- */
function setupEditorEvents() {
  $("btnBack").onclick = function () { closeToHome(); };
  $("btnUndo").onclick = undo;
  $("btnRedo").onclick = redo;
  $("btnPagePanel").onclick = togglePagePanel;
  $("btnPPClose").onclick = togglePagePanel;
  $("ppMask").onclick = togglePagePanel;
  $("btnPPAdd").onclick = function () { addPage(); };
  $("btnMore").onclick = function () {
    var r = $("btnMore").getBoundingClientRect();
    showMenu(r.left - 160, r.bottom + 6, edMoreItems());
  };
  var ti = $("nbTitle");
  ti.addEventListener("change", function () {
    var v = ti.value.trim();
    if (v && S.nb) { S.nb.name = v.slice(0, 40); document.title = S.nb.name + " - FreeBoard"; dirty(); }
    else ti.value = S.nb ? S.nb.name : "";
  });
  ti.addEventListener("keydown", function (e) {
    if (e.key === "Enter") ti.blur();
  });
  $("fImg").addEventListener("change", function () { importFiles(this.files); this.value = ""; });
  $("fCam").addEventListener("change", function () { importFiles(this.files); this.value = ""; });
  $("fPdf").addEventListener("change", function () { if (this.files.length) importPDF(this.files[0]); this.value = ""; });
  $("fRestore").addEventListener("change", function () { if (this.files.length) restoreFile(this.files[0]); this.value = ""; });
  $("fAllRestore").addEventListener("change", function () { if (this.files.length) restoreFile(this.files[0]); this.value = ""; });
  buildZoomBox();
  buildTxtBar();
  buildSelBar();
  /* 拖放导入 */
  document.addEventListener("dragover", function (e) { if (S.nb) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  document.addEventListener("drop", function (e) {
    if (!S.nb) return;
    e.preventDefault();
    var files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) importFiles(files);
  });
  /* 文本输入过程中点击其它区域→提交 */
  document.addEventListener("pointerdown", function (e) {
    if (!S.typing || !txtEdit) return;
    if (e.target.closest && e.target.closest("#txtOver")) return;
    if (e.target.closest && e.target.closest("#txtBar")) return;
    commitTextEdit(true);
  }, true);
  window.addEventListener("hashchange", function () { onHash(); });
}
function edMoreItems() {
  var items = [
    { icon: ic("download"), t: "导出当前页 PNG", f: exportPagePNG },
    { icon: ic("pdf"), t: "导出整本 PDF（含笔记）", f: exportBookPDF },
    { icon: ic("share"), t: "分享当前页", f: sharePage },
    { icon: ic("linePaper"), t: "纸张模板", f: paperModal },
    { icon: ic("rename"), t: "重命名白板", f: function () { promptBox("重命名", S.nb.name, function (v) { if (v) { S.nb.name = v; var t = $("nbTitle"); t.value = v; dirty(); document.title = v + " - FreeBoard"; } }); } },
    { icon: ic("folder"), t: "移动到文件夹", f: function () { moveNbModal(S.nb.id); } },
    { icon: ic("upload"), t: "备份这本白板", f: function () { backupNb(S.nb.id); } },
    { icon: ic("doc"), t: "全量备份 / 恢复", f: allBackupMenu }
  ];
  items.push({ icon: ic("help"), t: "帮助", f: function () { helpModal(); } });
  items.push({ icon: ic("settings"), t: "设置", f: settingsModal });
  items.push({ icon: ic("back"), t: "返回首页", f: closeToHome });
  return items;
}
function allBackupMenu() {
  var r = $("btnMore").getBoundingClientRect();
  showMenu(r.left - 170, r.bottom + 6, [
    { icon: ic("upload"), t: "全量备份（所有白板）", f: backupAll },
    { icon: ic("download"), t: "恢复全量备份", f: function () { $("fAllRestore").click(); } },
    { icon: ic("download"), t: "导入单个白板备份", f: function () { $("fRestore").click(); } }
  ]);
}
function paperModal() {
  var html = '<div class="form-tip">纸张模板整本生效，随时可更换。</div><div class="paper-grid" id="paperGrid"></div>';
  var m = modal("纸张模板", html, { footer: '<button class="btn primary" data-act="ok">完成</button>' });
  var g = $("paperGrid");
  g.innerHTML = PAPERS.map(function (p) {
    return '<button class="paper-big' + (S.nb.paper === p.id ? " on" : "") + '" data-p="' + p.id + '">' +
      '<span class="mini-paper" data-p="' + p.id + '"></span><i>' + p.name + "</i></button>";
  }).join("");
  qsa(".paper-big", g).forEach(function (b) {
    b.onclick = function () {
      qsa(".paper-big", g).forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      S.nb.paper = b.getAttribute("data-p");
      clearPatternCache();
      dirty(); requestRender();
    };
  });
  qs('[data-act="ok"]', m).onclick = closeModal;
}
/* ---------- 分享 ---------- */
function sharePage() {
  var c = renderPageCanvas(S.nb, S.pi);
  c.toBlob(function (blob) {
    if (!blob) return toast("导出失败");
    var name = safeName(S.nb.name) + "-第" + (S.pi + 1) + "页.png";
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], name, { type: "image/png" })] })) {
      navigator.share({ files: [new File([blob], name, { type: "image/png" })], title: S.nb.name }).catch(function () {});
    } else downloadFile(name, blob);
  }, "image/png");
}
/* ---------- 选择栏 ---------- */
function buildSelBar() {
  var bar = $("selBar");
  bar.innerHTML =
    '<span class="sel-count" id="selCount"></span>' +
    '<div class="sel-group" id="selColors">' + QUICK_COLORS.slice(0, 7).map(function (c) {
      return '<button class="sw small" data-c="' + c + '" style="background:' + c + '"></button>';
    }).join("") +
    '<label class="sw small cust" title="自定义"><input type="color" value="#1a1a1a"></label></div>' +
    '<div class="sel-group" id="selWGroup" title="调整粗细"><input type="range" id="selW" min="1" max="20" step="0.5"><b id="selWV"></b></div>' +
    '<button class="iconbtn" id="selDup" title="复制(Ctrl+C/Ctrl+V)">' + ic("dup") + "</button>" +
    '<button class="iconbtn" id="selDel" title="删除">' + ic("trash") + "</button>" +
    '<button class="iconbtn" id="selFront" title="置于顶层">' + ic("front") + "</button>" +
    '<button class="iconbtn" id="selBack" title="置于底层">' + ic("back2") + "</button>" +
    '<button class="iconbtn" id="selRot" title="顺时针旋转90°">' + ic("rotate") + "</button>";
  bar.querySelectorAll("#selColors .sw").forEach(function (b) {
    b.onclick = function () { var c = b.getAttribute("data-c"); if (c) selColor(c); };
  });
  var ci = qs('#selColors input[type="color"]');
  ci.oninput = function () { selColor(ci.value); };
  var w = $("selW"), wv = $("selWV");
  w.oninput = function () { selWidth(parseFloat(w.value)); wv.textContent = w.value; };
  $("selDup").onclick = selDuplicate;
  $("selDel").onclick = selDelete;
  $("selFront").onclick = function () { selOrder(true); };
  $("selBack").onclick = function () { selOrder(false); };
  $("selRot").onclick = selRotate90;
}
function syncSelBar() {
  var bar = $("selBar"); if (!bar) return;
  var n = S.sel.ids.length;
  bar.classList.toggle("hide", !n || !S.nb);
  if (!n) return;
  var items = selItems();
  $("selCount").textContent = n + " 项";
  var hasStroke = items.some(function (it) { return it.t === "s"; });
  $("selWGroup").style.display = hasStroke ? "" : "none";
  var hasColor = items.some(function (it) { return it.t === "s" || it.t === "x"; });
  $("selColors").style.display = hasColor ? "" : "none";
  if (hasStroke) {
    var ws = items.filter(function (it) { return it.t === "s"; }).map(function (it) { return it.w; });
    var avg = ws.reduce(function (a, b) { return a + b; }, 0) / ws.length;
    $("selW").value = clamp(Math.round(avg * 2) / 2, 1, 20);
    $("selWV").textContent = $("selW").value;
  }
}
/* ---------- 文字编辑栏 ---------- */
function buildTxtBar() {
  var bar = $("txtBar");
  bar.innerHTML =
    '<button class="btn primary slim" id="txDone">' + ic("check") + " 完成</button>" +
    '<select id="txFont" class="ctx-sel">' + FONT_LIST.map(function (f, i) { return '<option value="' + i + '">' + f[1] + "</option>"; }).join("") + "</select>" +
    '<label class="mini-slider"><b id="txFsV">22</b><input type="range" id="txFs" min="10" max="80" step="1"><span>字号</span></label>' +
    '<button class="iconbtn" id="txB" title="粗体">' + ic("bold") + "</button>" +
    '<button class="iconbtn" id="txI" title="斜体">' + ic("italic") + "</button>" +
    '<button class="iconbtn" id="txU" title="下划线">' + ic("under") + "</button>" +
    '<button class="iconbtn" id="txAL" title="左对齐">' + ic("left") + "</button>" +
    '<button class="iconbtn" id="txAC" title="居中">' + ic("center") + "</button>" +
    '<button class="iconbtn" id="txAR" title="右对齐">' + ic("right") + "</button>" +
    '<span class="txt-colors" id="txColors">' + QUICK_COLORS.slice(0, 8).map(function (c) { return '<button class="sw small" data-c="' + c + '" style="background:' + c + '"></button>'; }).join("") +
    '<label class="sw small cust"><input type="color" value="#1a1a1a"></label></span>';
  $("txDone").onclick = function () { commitTextEdit(true); };
  qsa("#txtBar .sw", bar).forEach(function (b) {
    b.onclick = function () {
      var c = b.getAttribute("data-c");
      if (c) { textStyleFromUI("color", c); markSw($("txColors"), c); }
    };
  });
  var ci = qs('#txtBar input[type="color"]');
  ci.oninput = function () { textStyleFromUI("color", ci.value); markSw($("txColors"), ci.value); };
  $("txFont").onchange = function () { textStyleFromUI("ff", parseInt(this.value, 10)); };
  $("txFs").oninput = function () { textStyleFromUI("fs", parseInt(this.value, 10)); $("txFsV").textContent = this.value; };
  $("txB").onclick = function () { textStyleFromUI("bold", !txtEdit.it.bold); };
  $("txI").onclick = function () { textStyleFromUI("italic", !txtEdit.it.italic); };
  $("txU").onclick = function () { textStyleFromUI("under", !txtEdit.it.under); };
  [["txAL", "left"], ["txAC", "center"], ["txAR", "right"]].forEach(function (p) {
    $(p[0]).onclick = function () { textStyleFromUI("align", p[1]); };
  });
  var ov = $("txtOver");
  ov.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); commitTextEdit(false); }
    e.stopPropagation();
  });
  ov.addEventListener("keyup", function () { syncTextPos(); });
}
function syncTxtBarUI() {
  if (!txtEdit) return;
  var it = txtEdit.it;
  $("txFont").value = it.ff || 0;
  $("txFs").value = it.fs;
  $("txFsV").textContent = it.fs;
  var togs = [["txB", it.bold], ["txI", it.italic], ["txU", it.under]];
  togs.forEach(function (p) { $(p[0]).classList.toggle("on", !!p[1]); });
  var als = [["txAL", "left"], ["txAC", "center"], ["txAR", "right"]];
  als.forEach(function (p) { $(p[0]).classList.toggle("on", (it.align || "left") === p[1]); });
  markSw($("txColors"), it.color);
}
function syncTextPos() {
  if (!txtEdit) return;
  var ov = $("txtOver");
  var bar = $("txtBar");
  var wrap = $("cvWrap");
  var wr = wrap.getBoundingClientRect();
  var it = txtEdit.it;
  var css = {
    left: Math.round(sx(it.x)) + "px",
    top: Math.round(sy(it.y)) + "px",
    minWidth: Math.max(40, it.w * S.view.z) + "px",
    font: fontStr(Math.max(10, it.fs * S.view.z), it.bold, it.italic, it.ff),
    color: it.color,
    textAlign: it.align
  };
  Object.keys(css).forEach(function (k) { ov.style[k] = css[k]; });
  bar.style.left = clamp(Math.round(sx(it.x)), 0, Math.max(0, wr.width - 320)) + "px";
  bar.style.top = Math.max(4, Math.round(sy(it.y)) - 54) + "px";
}
/* FreeBoard 2.0 启动 */
function onHash() {
  var m = location.hash.match(/^#\/?b\/([A-Za-z0-9]+)/);
  if (m && findNb(m[1])) {
    if (!$("scrEdit") || $("scrEdit").classList.contains("hide")) openNb(m[1]);
    else if (S.nb && S.nb.id !== m[1]) openNb(m[1]);
  } else if (m && !findNb(m[1])) {
    closeToHome();
  }
}
function boot() {
  loadDB().then(function () {
    applyTheme();
    document.title = "FreeBoard 白板";
    buildHome();
    onHash();
    if (("serviceWorker" in navigator) && /^https?:$/.test(location.protocol) && !location.hostname.startsWith("localhost")) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    }
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") saveDB(true); });
    setInterval(function () { if (S.nb) saveDB(true); }, 30000);
  });
}
/* ---------- 收尾修正 ---------- */
function wrapLines(text, ctx, fs, maxW) {
  var out = [];
  var paras = String(text || "").split("\n");
  for (var i = 0; i < paras.length; i++) {
    var para = paras[i];
    if (para === "") { out.push(""); continue; }
    var line = "";
    for (var j = 0; j < para.length; j++) {
      var ch = para[j];
      var t = line + ch;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; }
      else line = t;
    }
    out.push(line);
  }
  return out;
}
function onPasteDoc(e) {
  if (!S.nb) return;
  var files = (e.clipboardData && e.clipboardData.files) || [];
  if (files.length) { e.preventDefault(); importFiles(files); return; }
  var txt = (e.clipboardData && e.clipboardData.getData("text")) || "";
  if (txt && S.tool === "text" && !S.typing) {
    e.preventDefault();
    var r = cr();
    var it = createTextItem(wx(r.width / 2), wy(r.height / 2));
    it.text = txt;
    it.w = textWidth(it);
    histPush();
    curItems().push(it);
    S.sel.ids = [it.id];
    dirty(); syncSelBar(); requestRender();
  }
}
function createTextItem(x, y) {
  var t = S.conf.txt;
  return { id: genId(), t: "x", x: x, y: y, w: 240, rot: 0, text: "", fs: t.fs, ff: t.ff, color: t.color, bold: t.bold, italic: t.italic, under: t.under, align: t.align };
}
/* 暴露测试/接口钩子 */
var FB = {
  version: VERSION,
  getState: function () { return S; },
  getDB: function () { return DB; },
  newNb: function () { newNbModal(); },
  open: function (id) { openNb(id); },
  home: closeToHome,
  help: function () { helpModal(); }
};
window.FB = FB;
boot();
window.__FBTest = {
  ready: function () { return !!$("cv"); },
  state: function () { return S; },
  db: function () { return DB; },
  items: function () { return S.nb ? S.nb.pages[S.pi].items : []; },
  pageCount: function () { return S.nb ? S.nb.pages.length : 0; },
  openNb: openNb,
  setTool: setTool,
  zoom: function (z) { S.view.z = clamp(z, 0.08, 8); syncZoomUI(); requestRender(); },
  undo: undo, redo: redo,
  selDelete: selDelete,
  commitText: function () { if (S.typing) commitTextEdit(true); },
  draw: function () { return S.draw; }
};
})();
